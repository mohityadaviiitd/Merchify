version: '3.9'

services:
  backend:
    build: .
    # The command now points to your WSGI production server (Gunicorn)
    command: gunicorn merchify_backend.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Note: Removed local volume mounts ("- .:/app") because in production, 
    # your code should be permanently baked into the Docker image.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend